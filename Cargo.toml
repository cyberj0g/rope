[package]
name = "rope"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
eventsource-stream = "0.2"
flate2 = "1"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
url = "2.5"

[build-dependencies]
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
