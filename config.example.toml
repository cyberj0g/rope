model = "qwen"

# set this to override every model's temperature
# temperature = 0.8
reasoning_effort = "xhigh"
paste_collapse_chars = 200
compaction_threshold = 0.75

[[providers]]
name = "local"
base_url = "http://localhost:8000/v1"
api_key = ""
# use "chat_completions" for endpoints without Responses API support
api = "responses"

[[models]]
name = "qwen"
provider = "local"
id = "Qwen/Qwen3.8-27B"
max_context_tokens = 262144
temperature = 1.0
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]
# price_per_token = 0.0000025
vision = true

[tools]
read = "allow"
write = "ask"
edit = "ask"
shell = "ask"
search_files = "allow"
list_files = "allow"
web_browser = "ask"
web_search = "ask"
external = "ask"
