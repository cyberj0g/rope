<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f1115'/%3E%3Cpath d='M7 12h10M8 8h8M9.5 16h5' stroke='%234f8cff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Rope</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #15181e;
  --panel-2: #1b1f27;
  --border: #262c37;
  --text: #e7eaf0;
  --muted: #8b93a3;
  --faint: #5c6472;
  --accent: #4f8cff;
  --accent-dim: #2b4a80;
  --green: #3fb950;
  --amber: #d29922;
  --red: #f0564a;
  --purple: #a371f7;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --top: 52px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
::selection { background: #33507e; }
[hidden] { display: none !important; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #2c3340; border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- auth ---------- */
#auth {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.auth-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; }
.auth-logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
.auth-logo svg { width: 26px; height: 26px; color: var(--accent); }
.auth-card p { color: var(--muted); font-size: 13.5px; margin: 10px 0 18px; }
.field { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; outline: none; }
.field:focus { border-color: var(--accent-dim); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--accent); color: #fff; border-radius: 9px; padding: 11px 16px;
  font-weight: 600; width: 100%; margin-top: 12px;
}
.btn:active { filter: brightness(.9); }
.btn[disabled] { opacity: .5; }
.auth-error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ---------- app frame ---------- */
#app { display: none; height: 100dvh; flex-direction: column; }
#app.on { display: flex; }
#frame { display: flex; flex: 1; min-height: 0; }

/* ---------- sidebar ---------- */
#sidebar {
  position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(300px, 84vw);
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(-105%); transition: transform .18s ease;
}
#app.side-open #sidebar { transform: none; }
#sideBackdrop { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
#app.side-open #sideBackdrop { opacity: 1; pointer-events: auto; }
.side-head { padding: 14px 14px 8px; display: flex; align-items: center; gap: 8px; }
.side-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.side-brand svg { width: 20px; height: 20px; color: var(--accent); }
.side-new {
  margin: 8px 14px 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-weight: 600;
  background: var(--panel-2);
}
.side-new:active { background: #232936; }
.side-search { margin: 0 14px 10px; position: relative; }
.side-search input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
  padding: 8px 10px 8px 32px; outline: none; font-size: 14px;
}
.side-search svg { position: absolute; left: 10px; top: 8px; width: 16px; height: 16px; color: var(--faint); }
#sideList { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
.side-empty { color: var(--faint); font-size: 13.5px; text-align: center; padding: 26px 12px; }
.side-item {
  display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px;
  margin: 1px 0; position: relative;
}
.side-item:active { background: var(--panel-2); }
.side-item.on { background: var(--panel-2); outline: 1px solid var(--border); }
.side-item .t { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-item .d { width: 7px; height: 7px; border-radius: 50%; flex: none; background: transparent; }
.side-item .d.running { background: var(--amber); animation: pulse 1.4s infinite; }
.side-item .d.approval { background: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.side-item .m { color: var(--faint); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; }
.side-foot { border-top: 1px solid var(--border); padding: 10px 14px; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- top bar ---------- */
#topbar {
  height: var(--top); flex: none; display: flex; align-items: center; gap: 6px;
  padding: 0 8px; padding-top: env(safe-area-inset-top);
  background: var(--panel); border-bottom: 1px solid var(--border);
}
.iconbtn {
  width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--muted); flex: none;
}
.iconbtn:active { background: var(--panel-2); color: var(--text); }
.iconbtn svg { width: 21px; height: 21px; }
#tbTitle { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 2px; }
#tbName { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tbPhase { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#tbPhase .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
#tbPhase.generating .dot, #tbPhase.waiting .dot, #tbPhase.connecting .dot { background: var(--accent); animation: pulse 1.4s infinite; }
#tbPhase.generating, #tbPhase.waiting, #tbPhase.connecting { color: var(--accent); }
#tbPhase.tool .dot { background: var(--green); animation: pulse 1.4s infinite; }
#tbPhase.tool { color: var(--green); }
#tbPhase.approval .dot { background: var(--red); animation: pulse 1s infinite; }
#tbPhase.approval { color: var(--red); }
#tbPhase.error .dot { background: var(--red); }
#tbPhase.error { color: var(--red); }
#tbPhase.compacting .dot { background: var(--purple); animation: pulse 1.4s infinite; }
#tbPhase.compacting { color: var(--purple); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; max-width: 34vw;
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px;
  font-size: 12.5px; color: var(--muted); background: var(--panel-2); flex: none;
}
.chip b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip svg { width: 13px; height: 13px; flex: none; }

/* ---------- chat ---------- */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
#chat { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
#chatInner { max-width: 820px; margin: 0 auto; padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 14px; }
.empty-hint { text-align: center; color: var(--faint); margin: 18vh 20px 0; font-size: 14px; }
.empty-hint .big { font-size: 34px; margin-bottom: 10px; }

.msg { max-width: 100%; }
.msg .bubble {
  background: var(--panel); border: 1px solid var(--border); border-radius: 13px;
  padding: 10px 13px; overflow-wrap: anywhere;
}
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: var(--accent-dim); border-color: transparent; border-radius: 13px 13px 4px 13px; max-width: 88%; }
.msg.steer { display: flex; justify-content: flex-end; }
.msg.steer .bubble { background: #3a3116; border-color: #57481f; border-radius: 13px 13px 4px 13px; max-width: 88%; }
.who { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 4px; font-size: 12.5px; font-weight: 700; }
.who .mdl { font-weight: 500; color: var(--accent); font-size: 11.5px; }
.who.status { color: var(--faint); }
.badge-queued { font-size: 10.5px; font-weight: 600; color: var(--amber); border: 1px solid #57481f; border-radius: 999px; padding: 0 7px; margin-left: 4px; }
.msg.error .bubble { background: #301a19; border-color: #5c2a26; color: #ffb4ae; }
.msg.system { display: flex; justify-content: center; }
.msg.system .sys {
  display: inline-flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
}
.sys details summary { cursor: pointer; color: var(--accent); list-style: none; }

/* markdown */
.md { font-size: 14.5px; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { margin: 12px 0 6px; line-height: 1.3; }
.md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14.5px; }
.md h1:first-child, .md h2:first-child, .md h3:first-child, .md p:first-child { margin-top: 0; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
.md li { margin: 2px 0; }
.md .task { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--faint); border-radius: 4px; margin-right: 7px; vertical-align: -2px; position: relative; }
.md .task.done { background: var(--green); border-color: var(--green); }
.md .task.done::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3.5px; height: 7px; border: solid #08130b; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md code { font-family: var(--mono); font-size: .88em; background: #232936; border-radius: 4px; padding: 1px 5px; }
.md pre { background: #12151b; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; overflow-x: auto; margin: 6px 0 10px; }
.md pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; display: block; white-space: pre; }
.md table { border-collapse: collapse; margin: 6px 0 10px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--border); padding: 4px 9px; font-size: 13.5px; text-align: left; }
.md th { background: var(--panel-2); font-weight: 600; }
.md blockquote { margin: 6px 0 10px; padding: 2px 12px; border-left: 3px solid var(--accent-dim); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
.md strong { font-weight: 700; }
.md del { color: var(--muted); }
pre code .k { color: #c586c0; } pre code .s { color: #ce9178; } pre code .c { color: #6a737d; font-style: italic; }
pre code .n { color: #d19a66; } pre code .f { color: #dcdcaa; } pre code .b { color: #4ec9b0; }
mark.srch { background: #7a5b00; color: #fff; border-radius: 2px; }
mark.srch.cur { background: var(--amber); color: #1a1a1a; }
.imgrid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.imgrid img { max-width: 220px; max-height: 220px; border-radius: 8px; display: block; cursor: zoom-in; }
pre.plain { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin: 0; }

/* collapsible sections: thinking / tools */
details.sec { border: 1px solid var(--border); border-radius: 11px; background: var(--panel); overflow: hidden; }
details.sec > summary {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
  font-size: 13px; color: var(--muted); list-style: none; user-select: none;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .chev { width: 14px; height: 14px; flex: none; transition: transform .15s ease; color: var(--faint); }
details.sec[open] > summary .chev { transform: rotate(90deg); }
details.sec .body { padding: 4px 12px 11px; border-top: 1px solid var(--border); }
.sec .tag { font-weight: 600; }
.sec.thinking .tag { color: var(--purple); }
.sec.tool .tag { color: var(--green); }
.sec.tool[data-status="failed"] .tag { color: var(--red); }
.sec.tool[data-status="waiting-approval"] .tag { color: var(--red); }
.sec .meta { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.sec .status { font-size: 11.5px; font-weight: 600; }
.sec.tool[data-status="done"] .status { color: var(--green); }
.sec.tool[data-status="failed"] .status { color: var(--red); }
.sec.tool[data-status="running"] .status { color: var(--amber); }
.sec.tool[data-status="streaming"] .status, .sec.tool[data-status="pending"] .status { color: var(--accent); }
.sec.tool[data-status="waiting-approval"] .status { color: var(--red); }
.sec pre.toolarg, .sec pre.toolout { background: #12151b; border-radius: 8px; padding: 8px 10px; margin: 6px 0; max-height: 260px; overflow: auto; }
.sec .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-top: 8px; }
.spin { width: 13px; height: 13px; border: 2px solid var(--accent-dim); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); border-radius: 1px; animation: pulse 1s infinite; vertical-align: -2px; }

/* jump to bottom */
#jump {
  position: absolute; right: 14px; bottom: 12px; z-index: 5;
  width: 38px; height: 38px; border-radius: 50%; background: var(--panel-2);
  border: 1px solid var(--border); display: none; align-items: center; justify-content: center;
  color: var(--muted); box-shadow: 0 2px 10px rgba(0,0,0,.4);
}
#jump.on { display: flex; }
#jump svg { width: 19px; height: 19px; }

/* ---------- search bar ---------- */
#searchbar { display: none; border-bottom: 1px solid var(--border); background: var(--panel); padding: 6px 10px; gap: 6px; align-items: center; }
#searchbar.on { display: flex; }
#searchbar input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none; }
#searchCount { color: var(--muted); font-size: 12px; min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
#searchbar .iconbtn { width: 32px; height: 32px; }

/* ---------- composer ---------- */
#composer { flex: none; background: var(--panel); border-top: 1px solid var(--border); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
#compInner { max-width: 820px; margin: 0 auto; position: relative; }
#plates { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
#plates:empty { display: none; }
.plate { position: relative; width: 66px; height: 66px; border-radius: 10px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
.plate img { width: 100%; height: 100%; object-fit: cover; }
.plate .spin { position: absolute; }
.plate .err { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(64,20,18,.92); color: var(--red); font-size: 10px; text-align: center; padding: 4px; }
.plate .rm {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: rgba(10,12,16,.85); display: flex; align-items: center; justify-content: center; color: #fff;
}
.plate .rm svg { width: 12px; height: 12px; }
#compRow { display: flex; align-items: flex-end; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 5px 6px; }
#compRow:focus-within { border-color: var(--accent-dim); }
#input {
  flex: 1; background: none; border: 0; outline: none; resize: none; padding: 7px 4px;
  max-height: 160px; line-height: 1.45; color: var(--text);
}
#input::placeholder { color: var(--faint); }
.cbtn {
  width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  color: var(--muted); flex: none;
}
.cbtn:active { background: var(--panel-2); color: var(--text); }
.cbtn svg { width: 20px; height: 20px; }
#sendBtn { background: var(--accent); color: #fff; }
#sendBtn.stop { background: var(--red); }
#sendBtn[disabled] { background: var(--panel-2); color: var(--faint); }
#compHint { display: flex; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 11.5px; padding: 5px 4px 0; min-height: 20px; }
#compHint .l { display: flex; gap: 8px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#compHint kbd { font-family: var(--mono); font-size: 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

/* approval card */
#approval { display: none; max-width: 820px; margin: 0 auto 8px; background: #2b2314; border: 1px solid #57481f; border-radius: 12px; padding: 10px 12px; }
#approval.on { display: block; }
#approval .head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--amber); }
#approval .head svg { width: 16px; height: 16px; }
#approval pre { font-family: var(--mono); font-size: 11.5px; background: rgba(0,0,0,.35); border-radius: 8px; padding: 8px 10px; margin: 8px 0; max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
#approval .row { display: flex; gap: 8px; }
#approval .row button { flex: 1; border-radius: 8px; padding: 8px 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--panel-2); }
#approval .row .ok { background: #1d3524; border-color: #2d5539; color: var(--green); }
#approval .row .bad { background: #301a19; border-color: #5c2a26; color: var(--red); }

/* status strip */
#strip { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 4px 0; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
#strip .seg { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#ctxBar { width: 64px; height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
#ctxFill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s ease; }
#ctxFill.warn { background: var(--amber); }
#ctxFill.hot { background: var(--red); }
#strip .sp { flex: 1; }

/* slash palette */
#palette { position: absolute; left: 10px; right: 10px; bottom: calc(100% + 4px); z-index: 8; display: none; max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
#palette.on { display: block; }
.pal-item { display: flex; gap: 10px; align-items: baseline; padding: 9px 13px; cursor: pointer; }
.pal-item.sel, .pal-item:active { background: var(--panel-2); }
.pal-item .c { font-family: var(--mono); font-size: 13px; color: var(--accent); min-width: 90px; }
.pal-item .d { color: var(--muted); font-size: 12.5px; }

/* sheet */
#sheetWrap { position: fixed; inset: 0; z-index: 40; display: none; }
#sheetWrap.on { display: block; }
#sheetBackdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 72dvh;
  background: var(--panel); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0;
  transform: translateY(102%); transition: transform .22s cubic-bezier(.3,.8,.4,1);
  display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
}
#sheetWrap.on #sheet { transform: none; }
#sheetHead { display: flex; align-items: center; padding: 14px 16px 8px; gap: 8px; }
#sheetHead h2 { font-size: 15.5px; margin: 0; flex: 1; }
#sheetBody { overflow-y: auto; padding: 4px 16px 18px; }
.sheet-search { margin-bottom: 10px; }
.sheet-search input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; outline: none; }
.srow { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 9px; cursor: pointer; }
.srow:active { background: var(--panel-2); }
.srow .t { flex: 1; min-width: 0; }
.srow .t .n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .t .s { color: var(--faint); font-size: 12px; }
.srow .badge { font-size: 10.5px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; color: var(--muted); flex: none; }
.srow .badge.vision { color: var(--accent); border-color: var(--accent-dim); }
.plan-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 4px; font-size: 14px; }
.plan-row .ic { width: 18px; height: 18px; flex: none; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--faint); display: flex; align-items: center; justify-content: center; }
.plan-row.completed .ic { background: var(--green); border-color: var(--green); color: #08130b; }
.plan-row.completed { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.plan-row.in_progress .ic { border-color: var(--amber); }
.plan-row.in_progress .ic::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: pulse 1.2s infinite; }
.plan-row.pending { color: var(--muted); }
.plan-expl { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.git-row { display: flex; gap: 10px; align-items: center; padding: 7px 4px; font-family: var(--mono); font-size: 13px; }
.git-row .g { width: 14px; text-align: center; font-weight: 700; flex: none; }
.git-row .g.M { color: var(--amber); } .git-row .g.A, .git-row .g.U { color: var(--green); } .git-row .g.D { color: var(--red); }
.git-row .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-note { color: var(--faint); font-size: 12.5px; margin: 6px 4px; }

/* camera */
#camera { position: fixed; inset: 0; z-index: 45; background: #000; display: none; flex-direction: column; }
#camera.on { display: flex; }
#camera video { flex: 1; width: 100%; object-fit: cover; }
#camBar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px calc(20px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.7)); }
#camBar button { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #fff; background: transparent; display: flex; align-items: center; justify-content: center; color: #fff; }
#camBar .snap { background: #fff; }
#camBar svg { width: 24px; height: 24px; }

/* image viewer */
#viewer { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; }
#viewer.on { display: flex; }
#viewer img { max-width: 96vw; max-height: 92dvh; border-radius: 6px; }
#viewer .x { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; display: flex; align-items: center; justify-content: center; }

/* toasts */
#toasts { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { background: #232936; border: 1px solid var(--border); color: var(--text); font-size: 13px; border-radius: 10px; padding: 8px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.45); animation: rise .18s ease; max-width: 92vw; }
.toast.err { border-color: #5c2a26; color: #ffb4ae; }
@keyframes rise { from { opacity: 0; transform: translateY(-6px); } }

/* desktop */
@media (min-width: 900px) {

<script>
"use strict";
/* ============================== debug log (DOM channel for e2e) ============================== */
function dbgLog(m) {
  let d = document.getElementById("__dbg");
  if (!d) { d = document.createElement("pre"); d.id = "__dbg"; d.style.cssText = "position:fixed;left:-9999px;top:0;"; document.body.appendChild(d); }
  d.textContent += m + "\n";
}
/* ============================== icons & helpers ============================== */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1) + "k" : String(n);
function relTime(unix) {
  const d = (Date.now() / 1000 - unix) | 0;
  if (d < 60) return "just now";
  if (d < 3600) return (d / 60) | 0 + "m ago";
  if (d < 86400) return (d / 3600) | 0 + "h ago";
  return (d / 86400) | 0 + "d ago";
}
function toast(text, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = text;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
function beep() {
  if (!prefs.sound) return;
  try {
    beep.ctx = beep.ctx || new AudioContext();
    if (beep.ctx.state === "suspended") beep.ctx.resume();
    const t = beep.ctx.currentTime;
    for (const [f, at, dur] of [[880, 0, .09], [1318, .11, .16]]) {
      const o = beep.ctx.createOscillator(), g = beep.ctx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(.001, t + at);
      g.gain.exponentialRampToValueAtTime(.12, t + at + .015);
      g.gain.exponentialRampToValueAtTime(.001, t + at + dur);
      o.connect(g).connect(beep.ctx.destination);
      o.start(t + at); o.stop(t + at + dur + .05);
    }
  } catch {}
}

/* ============================== markdown ============================== */
const KEYWORDS = new Set(("let const var fn function return if else match while for loop break continue impl pub struct enum trait type use mod " +
  "def class import from as with try except raise new delete void int float bool string true false null this self None True False " +
  "export default async await switch case do in of not and or is None def echo set export local then elif fi end done elif").split(" "));
function highlight(code, lang) {
  const hashComment = /^(?:sh|bash|zsh|py|python|rb|toml|ini|make)$/.test(lang);
  const pattern = /(\/\/[^\n]*|#[^!\n][^\n]*|\/\*[\s\S]*?\*\/|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`|\b\d+(?:\.\d+)?\b|\b[A-Za-z_][A-Za-z0-9_]*(?=\s*\()|\b[A-Za-z_][A-Za-z0-9_]*\b)/g;
  return code.replace(pattern, m => {
    let cls = "";
    if (m[0] === '"' || m[0] === "'" || m[0] === "`") cls = "s";
    else if (m[0] === "/" || (m[0] === "#" && hashComment)) cls = "c";
    else if (/^\d/.test(m)) cls = "n";
    else if (KEYWORDS.has(m)) cls = "k";
    else if (m[0] === "_" || /[a-z]/.test(m[0])) cls = "f";
    return cls ? `<span class="${cls}">${esc(m)}</span>` : esc(m);
  });
}
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,
    (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u.replace(/^[a-z]+:\/\//i, "").slice(0, 48)}${u.length > 60 ? "…" : ""}</a>`);
  return s;
}
function md(text) {
  if (!text) return "";
  const fences = [];
  const body = text.replace(/```([\w+-]*)\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    fences.push(`<pre data-lang="${esc(lang)}"><code>${highlight(code.replace(/\n$/, ""), lang)}</code></pre>`);
    return `\u0000F${fences.length - 1}\u0000`;
  });
  const lines = body.split("\n");
  let html = "", para = [], list = null;
  const flushP = () => {
    if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; }
  };
  const flushL = () => {
    if (list) {
      html += `<${list.tag}>${list.items.map(i =>
        `<li>${i.task ? `<span class="task${i.done ? " done" : ""}"></span>` : ""}${inline(i.text)}</li>`
      ).join("")}</${list.tag}>`;
      list = null;
    }
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const t = line.trim();
    if (/^\u0000F\d+\u0000$/.test(t)) { flushP(); flushL(); html += t; continue; }
    if (!t) { flushP(); flushL(); continue; }
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)/))) { flushP(); flushL(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if (/^(-{3,}|\*{3,})$/.test(t)) { flushP(); flushL(); html += "<hr>"; continue; }
    if (/^>\s?/.test(t)) {
      flushP(); flushL();
      const q = [t.replace(/^>\s?/, "")];
      while (lines[i + 1] && /^>\s?/.test(lines[i + 1].trim())) { i++; q.push(lines[i].trim().replace(/^>\s?/, "")); }
      html += `<blockquote>${q.map(inline).join("<br>")}</blockquote>`; continue;
    }
    if (t.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flushP(); flushL();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const head = cells(t); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) { rows.push(cells(lines[i])); i++; }
      i--;
      html += `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      continue;
    }
    if ((m = t.match(/^[-*]\s+\[( |x|X)\]\s+(.*)/))) {
      flushP();
      if (!list || list.tag !== "ul") { flushL(); list = { tag: "ul", items: [] }; }
      list.items.push({ text: m[2], task: true, done: m[1].toLowerCase() === "x" }); continue;
    }
    if ((m = t.match(/^[-*]\s+(.*)/))) {
      flushP();
      if (!list || list.tag !== "ul") { flushL(); list = { tag: "ul", items: [] }; }
      list.items.push({ text: m[1] }); continue;
    }
    if ((m = t.match(/^\d+[.)]\s+(.*)/))) {
      flushP();
      if (!list || list.tag !== "ol") { flushL(); list = { tag: "ol", items: [] }; }
      list.items.push({ text: m[1] }); continue;
    }
    flushL(); para.push(t);
  }
  flushP(); flushL();
  return html.replace(/\u0000F(\d+)\u0000/g, (_, i) => fences[+i]);
}
function plain(text) {
  return `<pre class="plain">${esc(text)}</pre>`;
}

/* ============================== state ============================== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const prefs = Object.assign({ showThinking: true, showTools: true, sound: true }, LS.get("rope.prefs", {}));
const savePrefs = () => LS.set("rope.prefs", prefs);
let history = LS.get("rope.history", []);
const saveHistory = () => LS.set("rope.history", history.slice(0, 100));

const S = {
  token: LS.get("rope.token", ""),
  clientId: LS.get("rope.client", null),
  serverId: LS.get("rope.server", null),
  requestId: 0,
  socket: null,
  models: [],
  projectRoot: "",
  project: null,
  catalog: [],
  sessions: new Map(),
  selected: null,
  pending: new Map(),
  chunks: new Map(),
  reconnect: null,
  lastPhase: "idle",
};
let attachments = [];
let camStream = null;
let sheetOpen = null;
let palIndex = -1;

/* ============================== protocol ============================== */
function connect() {
  clearTimeout(S.reconnect);
  if (S.socket) { S.socket.onclose = null; S.socket.onerror = null; S.socket.close(); }
  S.chunks.clear();
  const wsUrl = `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`;
  const socket = new WebSocket(wsUrl);
  S.socket = socket;
  setPhase("connecting", "connecting…");
  socket.onopen = () => {
    const hello = { protocol: 1, token: S.token };
    if (S.clientId && S.serverId) { hello.client_id = S.clientId; hello.server_id = S.serverId; }
    socket.send(JSON.stringify(hello));
  };
  socket.onmessage = e => { try { receive(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  socket.onerror = () => {};
  socket.onclose = () => {
    const uncertain = S.pending.size > 0;
    S.pending.clear();
    setPhase("idle", uncertain ? "disconnected — an action may have been accepted" : "disconnected; reconnecting…");
    S.reconnect = setTimeout(connect, 1500);
  };
}
function request(value, done = () => {}) {
  if (S.socket?.readyState !== WebSocket.OPEN) { toast("Not connected", "err"); return Promise.reject(new Error("offline")); }
  const id = String(++S.requestId);
  return new Promise((res, rej) => {
    S.pending.set(id, (r, e) => e ? rej(Object.assign(new Error(e.message), { code: e.code })) : res(r));
    S.socket.send(JSON.stringify({ request_id: id, ...value }));
  });
}
const command = (action, done) => S.selected && request({ type: "command", session_id: S.selected, action }, done);

function select(id) {
  if (S.selected === id) return;
  if (S.selected) request({ type: "unsubscribe", session_id: S.selected }, () => {});
  S.selected = id;
  LS.set("rope.session", id);
  stickBottom = true;
  hidePalette();
  if (id) request({ type: "subscribe", session_id: id }, () => {});
  renderAll();
}
function receive(message) {
  if (message.type === "chunk") {
    const parts = S.chunks.get(message.id) || [];
    if (message.index !== parts.length) { S.socket.onclose = null; S.socket.close(); return; }
    parts.push(message.data); S.chunks.set(message.id, parts); return;
  }
  if (message.type === "chunk_end") {
    const parts = S.chunks.get(message.id); S.chunks.delete(message.id);
    if (!parts || parts.length !== message.count) { S.socket.onclose = null; S.socket.close(); return; }
    receive(JSON.parse(parts.join(""))); return;
  }
  switch (message.type) {
    case "hello":
      S.clientId = message.client_id; S.serverId = message.server_id;
      LS.set("rope.client", S.clientId);
      LS.set("rope.server", S.serverId);
      S.models = message.models; S.projectRoot = message.project_root;
      renderAll();
      if (S.selected) request({ type: "subscribe", session_id: S.selected }, () => {});
      break;
    case "catalog":
      S.catalog = message.catalog.sessions;
      renderSide(); break;
    case "project":
      S.project = message.update;
      renderChips(); break;
    case "snapshot": {
      const snap = message.snapshot;
      S.sessions.set(snap.session_id, snap);
      if (snap.session_id === S.selected) renderAll();
      break;
    }
    case "event": {
      const update = message.update;
      const snap = S.sessions.get(update.session_id);
      if (!snap || update.seq <= snap.seq) break;
      if (update.seq !== snap.seq + 1) {
        request({ type: "subscribe", session_id: update.session_id }, () => {});
        break;
      }
      for (const change of update.changes) {
        if (change.type === "insert") {
          const index = change.before ? snap.blocks.findIndex(b => b.id === change.before) : -1;
          snap.blocks.splice(index < 0 ? snap.blocks.length : index, 0, change.block);
        } else if (change.type === "replace") {
          const index = snap.blocks.findIndex(b => b.id === change.block.id);
          if (index >= 0) snap.blocks[index] = change.block; else snap.blocks.push(change.block);
        } else if (change.type === "append") {
          const block = snap.blocks.find(b => b.id === change.block_id);
          if (!block) continue;
          if (change.field === "content") block.content += change.text;
          else if (block.tool) block.tool[change.field] = (block.tool[change.field] || "") + change.text;
        } else if (change.type === "state") snap.state = change.state;
        else if (change.type === "plan") snap.plan = change.plan;
        else if (change.type === "project") snap.project = change.project;
      }
      snap.seq = update.seq;
      if (update.session_id === S.selected) renderAll();
      break;
    }
    case "resync_required":
      if (message.session_id === S.selected) request({ type: "subscribe", session_id: message.session_id }, () => {});
      break;
    case "reply": {
      const done = S.pending.get(message.request_id);
      S.pending.delete(message.request_id);
      if (done) done(message.result, message.error);
      break;
    }
    case "error":
      if (message.code === "unauthorized") {
        clearTimeout(S.reconnect);
        S.socket.onclose = null; S.socket.close();
        S.token = ""; LS.set("rope.token", "");
        showAuth("Invalid token");
      } else if (message.code === "expired_client") {
        S.clientId = null; S.serverId = null; LS.set("rope.client", null);
        toast(message.message, "err");
      } else toast(`${message.code}: ${message.message}`, "err");
      break;
  }
}

let renderPending = false;
function renderAll() {
  if (renderPending) return;

    renderPending = false;

      renderSide(); renderChat(); renderStatus(); renderChips(); renderApproval();
    } catch (err) {
      console.error("render error", err);

async function imageUrl(session, path) {

    if (!res.ok) throw new Error("HTTP " + res.status);

let lastIds = "";

// Layout changes (approval card, attachment plates) resize the chat area and
// fire scroll events without user intent, so only honor scrolls that follow a
// real wheel/touch/key input.
let userScrollAt = 0;
for (const ev of ["wheel", "touchstart", "pointerdown", "keydown"]) {
  $("chat").addEventListener(ev, () => { userScrollAt = Date.now(); }, { passive: true });
}
$("chat").addEventListener("scroll", () => {
  const away = $("chat").scrollHeight - $("chat").scrollTop - $("chat").clientHeight;
  const byUser = Date.now() - userScrollAt < 150;

function renderChat() {
  const chat = $("chat");
  const inner = $("chatInner");
  const snap = S.selected && S.sessions.get(S.selected);
  if (!snap) {
    if (inner.children.length) inner.innerHTML = "";
    inner._els = null;
    if (inner.children.length === 0) {
      inner.innerHTML = `<div class="empty-hint"><div class="big">◦</div>Pick a conversation or start a new one.<br>Your messages stream in live, with tools, thinking, and plans.</div>`;
    }
    return;
  }
  const blocks = snap.blocks;
  const ids = blocks.map(b => b.id).join(",");
  if (ids !== lastIds || !inner._els) {
    lastIds = ids;
    inner.innerHTML = "";
    inner._els = new Map();
    for (const b of blocks) {
      const el = blockEl(S.selected, b);
      inner.appendChild(el);
      inner._els.set(b.id, { key: blockKey(b), el });
    }
    if (search.query) applySearch();
  } else {
    for (const b of blocks) {
      const rec = inner._els.get(b.id);
      if (!rec) continue;
      const key = blockKey(b);
      if (key !== rec.key) {
        rec.key = key;
        const fresh = blockEl(S.selected, b);
        fresh._timer && (fresh._timer.open = rec.el._timer?.open || false);
        rec.el.replaceWith(fresh);
        rec.el = fresh;
      }
    }
  }
  // live cursor while generating
  const gen = snap.state.phase === "generating";
  for (const [id, rec] of inner._els) {
    const b = blocks.find(x => x.id === id);
    if (!b || (b.kind !== "assistant" && b.kind !== "thinking") || b.tool) continue;
    const marker = rec.el.querySelector(".cursor");
    if (gen && b === blocks[blocks.length - 1] && b.content) {
      if (!marker) {
        const c = document.createElement("span");
        c.className = "cursor";
        rec.el.querySelector(".bubble, .body")?.appendChild(c);

/* ticking timers: the snapshot carries the last reported elapsed_ms, so running

const localTimers = new Map();
setInterval(() => {
  const snap = S.selected && S.sessions.get(S.selected);
  const inner = $("chatInner");
  if (!snap || !inner._els) return;
  const now = performance.now();
  for (const b of snap.blocks) {
    if (!b.timer.running) { localTimers.delete(b.id); continue; }
    let t = localTimers.get(b.id);
    if (!t) { localTimers.set(b.id, { base: b.timer.elapsed_ms, at: now }); t = localTimers.get(b.id); }
    const ms = t.base + (now - t.at);
    const rec = inner._els.get(b.id);
    if (rec?.el._timer) {
      const el = rec.el._timer.querySelector(".meta .timer");
      if (el) el.textContent = fmtDur(ms) + " …";
    }
  }
}, 500);

        rwrap.appendChild(row);

      note.after(rwrap);
    }
  });
};

$("chipGit").onclick = () => {
  const proj = (S.selected && S.sessions.get(S.selected)?.project) || S.project;
  openSheet("Project", body => {
    if (!proj || !proj.git_available) { body.innerHTML = `<div class="sheet-note">This project is not a git repository.</div>`; return; }
    body.innerHTML = `<div class="sheet-note">${esc(proj.cwd)}</div>`;
    if (!proj.git_files.length) { body.innerHTML += `<div class="sheet-note">Working tree clean.</div>`; return; }
    for (const f of proj.git_files) {
      const row = document.createElement("div");
      row.className = "git-row";
      const st = f.status.trim();
      const cls = st[0] === "M" ? "M" : st[0] === "A" ? "A" : st[0] === "D" ? "D" : st[0] === "?" ? "U" : "M";
      row.innerHTML = `<span class="g ${cls}">${esc(st)}</span><span class="p">${esc(f.path)}</span>`;
      body.appendChild(row);
    }
  });
};
$("chipPlan").onclick = () => {
  const plan = S.selected && S.sessions.get(S.selected)?.plan;
  openSheet("Plan", body => {
    if (!plan) { body.innerHTML = `<div class="sheet-note">No active plan.</div>`; return; }
    if (plan.explanation) { const p = document.createElement("p"); p.className = "plan-expl"; p.textContent = plan.explanation; body.appendChild(p); }
    for (const step of plan.plan) {
      const row = document.createElement("div");
      row.className = `plan-row ${step.status}`;
      row.innerHTML = `<span class="ic">${step.status === "completed" ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="m4 12.5 5.5 5.5L20 6.5"/></svg>' : ""}</span><span>${esc(step.step)}</span>`;
      body.appendChild(row);
    }
  });
};

/* ============================== composer ============================== */
const input = $("input");
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
  maybePalette();
});
input.addEventListener("keydown", e => {
  if (e.key === "Escape" && palIndex >= 0) { e.preventDefault(); hidePalette(); return; }
  if (e.key === "ArrowDown" && palIndex >= 0) { e.preventDefault(); palMove(1); return; }
  if (e.key === "ArrowUp" && palIndex >= 0) { e.preventDefault(); palMove(-1); return; }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (palIndex >= 0) {
      const item = $("palette").children[palIndex];
      const cmd = item?.querySelector(".c")?.textContent || "/";
      runSlash(cmd, input.value.slice(cmd.length));
      return;
    }
    send();
    return;
  }
  if (e.key === "ArrowUp" && !input.value && history.length) {
    e.preventDefault(); histMove(1); return;
  }
  if (e.key === "ArrowDown" && histPos > 0) {
    e.preventDefault(); histMove(-1); return;
  }
});
let histPos = 0;
function histMove(dir) {
  if (dir > 0) histPos = Math.min(histPos + 1, history.length);
  else histPos = Math.max(histPos - 1, 0);
  input.value = histPos ? history[histPos - 1] : "";
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
  input.selectionStart = input.selectionEnd = input.value.length;
}
$("sendBtn").onclick = () => {
  const st = S.selected && S.sessions.get(S.selected)?.state;
  if (st?.turn_id) command({ type: "cancel", turn_id: st.turn_id }).catch(e => toast(e.message, "err"));
  else send();
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if ($("viewer").classList.contains("on")) { $("viewer").classList.remove("on"); return; }
    if ($("camera").classList.contains("on")) { closeCamera(); return; }
    if ($("sheetWrap").classList.contains("on")) { closeSheet(); return; }
    if ($("searchbar").classList.contains("on")) { closeSearch(); return; }
    if (document.activeElement === input || document.activeElement === $("sideFilter")) return;
    const st = S.selected && S.sessions.get(S.selected)?.state;
    if (st?.turn_id) command({ type: "cancel", turn_id: st.turn_id }).catch(() => {});
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") { e.preventDefault(); openSearch(); }
});
async function send() {
  const text = input.value;
  if (!text.trim() && !attachments.length) return;
  if (S.socket?.readyState !== WebSocket.OPEN) { toast("Not connected", "err"); return; }
  const content = text.trim();
  const keptPlates = attachments;
  try {
    if (!S.selected) {
      const { session_id } = await request({ type: "create_session", name: null });
      select(session_id);
    }
    for (const a of keptPlates) if (!a.path) a.path = (await uploadAttachment(a)).path;
    const atts = keptPlates.map(a => a.path);
    const session = S.selected;
    pushHistory(content);
    await command({ type: "send_message", content, attachments: atts });
    if (S.selected === session) {
      input.value = ""; histPos = 0;
      input.style.height = "auto";
      if (attachments === keptPlates) clearAttachments();
    }
  } catch (e) {
    toast(e.message, "err");
  }
}
function pushHistory(t) {
  t = t.trim();
  if (!t) return;
  if (history[0] !== t) { history.unshift(t); saveHistory(); }
}

/* ---------- attachments ---------- */
$("attachBtn").onclick = () => $("filePick").click();
$("filePick").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
$("cameraBtn").onclick = () => openCamera();
$("camPick").onchange = e => { if (e.target.files[0]) addFile(e.target.files[0]); e.target.value = ""; };
// Plate IDs only need to be unique within this page's composer, and
// crypto.randomUUID is unavailable in non-secure contexts (plain-HTTP LAN
// access), so keep a plain counter instead.
let attSeq = 0;
function addFile(file) {
  if (!/image\/(png|jpeg|jpg|gif|webp)/.test(file.type)) { toast("Unsupported image type", "err"); return; }
  if (file.size > 16 * 1024 * 1024) { toast("Image exceeds 16 MiB", "err"); return; }
  if (attachments.length >= 8) { toast("At most 8 images per message", "err"); return; }
  attachments.push({ id: `att-${++attSeq}`, file, path: null, error: false });
  renderPlates();
}
function addFiles(files) { files.forEach(addFile); }
function clearAttachments() {
  for (const a of attachments) { const u = a.preview; if (u) URL.revokeObjectURL(u); }
  attachments = [];
  renderPlates();
}
function renderPlates() {
  const row = $("plates");
  row.innerHTML = "";
  for (const a of attachments) {
    const plate = document.createElement("div");
    plate.className = "plate";
    if (!a.preview) a.preview = URL.createObjectURL(a.file);
    plate.innerHTML = `<img src="${a.preview}" alt="">${a.path ? "" : '<div class="spin"></div>'}${a.error ? `<div class="err">failed</div>` : ""}<button class="rm" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
    plate.querySelector(".rm").onclick = () => {
      attachments = attachments.filter(x => x.id !== a.id);
      renderPlates();
    };
    row.appendChild(plate);
  }
}
async function uploadAttachment(a) {
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(S.selected)}/attachments`, {
      method: "POST", headers: { Authorization: `Bearer ${S.token}` }, body: a.file,
    });
    if (!res.ok) throw new Error(await res.text());
    return await res.json();
  } catch (e) { a.error = true; renderPlates(); throw e; }
}

/* ---------- camera ---------- */
async function openCamera() {
  if (navigator.mediaDevices?.getUserMedia) {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      $("camVideo").srcObject = camStream;
      $("camera").classList.add("on");
      return;
    } catch {}
  }
  $("camPick").click();
}
function closeCamera() {
  camStream?.getTracks().forEach(t => t.stop());
  camStream = null;
  $("camera").classList.remove("on");
}
$("camCancel").onclick = closeCamera;
$("camSnap").onclick = () => {
  const v = $("camVideo");
  const canvas = document.createElement("canvas");
  canvas.width = v.videoWidth; canvas.height = v.videoHeight;
  canvas.getContext("2d").drawImage(v, 0, 0);
  canvas.toBlob(blob => {
    closeCamera();
    if (blob) addFile(new File([blob], "camera.jpg", { type: "image/jpeg" }));
  }, "image/jpeg", .92);
};

/* ---------- image viewer ---------- */
$("viewerX").onclick = () => $("viewer").classList.remove("on");
$("viewer").onclick = e => { if (e.target === $("viewer")) $("viewer").classList.remove("on"); };

/* ---------- slash palette ---------- */
const COMMANDS = [
  { c: "/new", d: "Start a new conversation (/new my name names it)" },
  { c: "/compact", d: "Compact the conversation context" },
  { c: "/model", d: "Choose model & reasoning effort" },
  { c: "/thinking", d: "Toggle thinking blocks (/thinking off)" },
  { c: "/tools", d: "Toggle tool blocks (/tools off)" },
  { c: "/plan", d: "Show the plan" },
  { c: "/git", d: "Show project git status" },
  { c: "/search", d: "Search this conversation" },
  { c: "/sound", d: "Toggle completion sound (/sound off)" },
  { c: "/clear", d: "Clear the input" },
  { c: "/help", d: "Show commands" },
];
function maybePalette() {
  const v = input.value;
  if (!v.startsWith("/") || input.selectionStart !== input.selectionEnd) { hidePalette(); return; }
  const items = v === "/"
    ? COMMANDS
    : COMMANDS.filter(c => v.includes(" ") ? c.c === v.slice(0, v.indexOf(" ")) : c.c.startsWith(v));
  if (!items.length) { hidePalette(); return; }
  const pal = $("palette");
  pal.innerHTML = "";
  palIndex = 0;
  items.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "pal-item" + (i === 0 ? " sel" : "");
    el.innerHTML = `<span class="c">${esc(c.c)}</span><span class="d">${esc(c.d)}</span>`;
    el.onclick = () => runSlash(c.c, v.slice(c.c.length));
    pal.appendChild(el);
  });
  pal.onitems = items;
  pal.classList.add("on");
}
function palMove(dir) {
  const pal = $("palette");
  const items = pal.onitems || [];
  palIndex = (palIndex + dir + items.length) % items.length;
  [...pal.children].forEach((el, i) => el.classList.toggle("sel", i === palIndex));
  pal.children[palIndex]?.scrollIntoView({ block: "nearest" });
}
function hidePalette() { $("palette").classList.remove("on"); palIndex = -1; }
async function runSlash(cmd, rest) {
  hidePalette();
  input.value = "";
  input.style.height = "auto";
  const arg = rest.trim();
  if (cmd === "/new") newSession(arg || null);
  else if (cmd === "/compact") {
    const st = S.selected && S.sessions.get(S.selected)?.state;
    if (!st) toast("Open a conversation first");
    else command({ type: "compact" }).catch(e => toast(e.message, "err"));
  }
  else if (cmd === "/model") $("chipModel").click();
  else if (cmd === "/thinking") prefs.showThinking = arg === "off" ? false : !prefs.showThinking;
  else if (cmd === "/tools") prefs.showTools = arg === "off" ? false : !prefs.showTools;
  else if (cmd === "/sound") prefs.sound = arg === "off" ? false : !prefs.sound;
  else if (cmd === "/plan") { const p = S.selected && S.sessions.get(S.selected)?.plan; openSheet("Plan", b => {
    if (!p) { b.innerHTML = `<div class="sheet-note">No active plan.</div>`; return; }
    for (const step of p.plan) { const row = document.createElement("div"); row.className = `plan-row ${step.status}`; row.innerHTML = `<span class="ic"></span><span>${esc(step.step)}</span>`; b.appendChild(row); }
  }); }
  else if (cmd === "/git") $("chipGit").click();
  else if (cmd === "/search") openSearch();
  else if (cmd === "/clear") { clearAttachments(); }
  else if (cmd === "/help") openSheet("Commands", b => {
    for (const c of COMMANDS) { const row = document.createElement("div"); row.className = "plan-row pending"; row.innerHTML = `<span class="ic" style="width:auto;border:0;font-family:var(--mono);font-size:12px;color:var(--accent)">${esc(c.c)}</span><span>${esc(c.d)}</span>`; b.appendChild(row); }
  });
  if (cmd === "/thinking" || cmd === "/tools" || cmd === "/sound") {
    savePrefs(); renderChat(); toast(`${cmd.slice(1)}: ${prefs[cmd.slice(1)]} ${prefs[cmd.slice(1)] ? "on" : "off"}`);
  }
}

/* ---------- search ---------- */
const search = { query: "", matches: [], pos: -1 };
function openSearch() {
  $("searchbar").classList.add("on");
  $("searchInput").focus();
  if (search.query) applySearch();
}
function closeSearch() {
  $("searchbar").classList.remove("on");
  search.query = ""; search.pos = -1;
  $("searchCount").textContent = "0/0";
  renderChat();
}
$("tbSearch").onclick = openSearch;
$("searchClose").onclick = closeSearch;
$("searchInput").oninput = e => { search.query = e.target.value.trim(); search.pos = -1; applySearch(); };
$("searchInput").onkeydown = e => {
  if (e.key === "Enter") { e.preventDefault(); moveSearch(e.shiftKey ? -1 : 1); }
  if (e.key === "Escape") closeSearch();
};
$("searchNext").onclick = () => moveSearch(1);
$("searchPrev").onclick = () => moveSearch(-1);
function moveSearch(dir) {
  if (!search.matches.length) return;
  search.pos = (search.pos + dir + search.matches.length) % search.matches.length;
  search.matches.forEach(m => m.classList.remove("cur"));
  search.matches[search.pos].classList.add("cur");
  $("searchCount").textContent = `${search.pos + 1}/${search.matches.length}`;
  search.matches[search.pos].scrollIntoView({ block: "center", behavior: "smooth" });
}
function applySearch() {
  const inner = $("chatInner");
  inner.querySelectorAll("mark.srch").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  if (!search.query) { search.matches = []; $("searchCount").textContent = "0/0"; return; }
  const q = search.query.toLowerCase();
  const walker = document.createTreeWalker(inner, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) {
    const node = walker.currentNode;
    if (node.parentElement.closest("mark")) continue;
    if (node.nodeValue.toLowerCase().includes(q)) targets.push(node);
  }
  search.matches = [];
  search.pos = -1;
  for (const node of targets) {
    const frag = document.createDocumentFragment();
    let rest = node.nodeValue, idx;
    while ((idx = rest.toLowerCase().indexOf(q)) >= 0) {
      frag.appendChild(document.createTextNode(rest.slice(0, idx)));
      const mark = document.createElement("mark");
      mark.className = "srch";
      mark.textContent = rest.slice(idx, idx + q.length);
      frag.appendChild(mark);
      search.matches.push(mark);
      rest = rest.slice(idx + q.length);
    }
    frag.appendChild(document.createTextNode(rest));
    node.parentNode.replaceChild(frag, node);
  }
  if (search.matches.length) {
    search.pos = 0;
    $("searchCount").textContent = `${search.pos + 1}/${search.matches.length}`;
    search.matches[0].classList.add("cur");
    search.matches[0].scrollIntoView({ block: "center" });
  } else $("searchCount").textContent = "0/0";
}

/* ============================== auth & boot ============================== */
function showAuth(err) {
  $("app").classList.remove("on");
  $("auth").style.display = "flex";
  if (err) $("authError").textContent = err;
  $("authToken").value = S.token;
}
function boot() {
  if (!S.token) { showAuth(); return; }
  $("auth").style.display = "none";
  $("app").classList.add("on");
  connect();
  const saved = LS.get("rope.session", null);
  if (saved) S.selected = saved; // snapshot arrives after subscribe on hello
}
$("authGo").onclick = () => {
  S.token = $("authToken").value.trim();
  if (!S.token) { $("authError").textContent = "Enter the server token"; return; }
  LS.set("rope.token", S.token);
  $("authError").textContent = "";
  S.clientId = null; S.serverId = null; LS.set("rope.client", null);
  $("auth").style.display = "none";
  $("app").classList.add("on");
  connect();
};
$("authToken").addEventListener("keydown", e => { if (e.key === "Enter") $("authGo").click(); });
// Debug/e2e handle: read-only view of the connection state.
window.__rope = { get state() { return S; }, prefs };
boot();
</script>
